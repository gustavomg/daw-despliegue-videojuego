# Nginx como puerta de entrada única: sirve los estáticos del frontend y hace de proxy inverso
# hacia el backend para /api y /socket.io (mismo origen -> sin CORS).
#
# NOTA PARA EL EJERCICIO DE ESCALADO (ver Guía de Despliegue, sección "Experimentar con
# cambios"): "backend" se resuelve mediante el DNS interno de Docker. Si se escala el servicio
# `backend` a varias réplicas (docker compose up -d --scale backend=2), Docker reparte las
# peticiones/entre las réplicas SIN garantizar que un mismo cliente WebSocket siempre hable con
# la misma réplica ("sticky sessions"). Esta configuración NO resuelve ese problema a propósito:
# es el punto de partida para que el alumnado lo descubra y proponga una solución.
server {
    listen 80;
    server_name _;

    # --- Frontend estático ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API REST ---
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (Socket.IO) ---
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Métricas Prometheus del backend (texto plano) ---
    location /metrics {
        proxy_pass http://backend:3000/metrics;
    }
}
